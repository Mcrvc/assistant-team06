<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A97D" />
      <stop offset="50%" stop-color="#DE8C5A" />
      <stop offset="100%" stop-color="#C56F3F" />
    </linearGradient>
    <linearGradient id="c1card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FBF9F1" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Warm background (inspired by left card in reference) -->
  <rect width="400" height="240" fill="url(#c1bg)" />

  <!-- Abstract architectural geometric silhouettes -->
  <path d="M0 240 L160 80 L280 240 Z" fill="#B35F33" fill-opacity="0.4" />
  <path d="M220 240 L340 110 L400 190 L400 240 Z" fill="#9C4E26" fill-opacity="0.3" />

  <!-- Floating Job Profile / Interview Dossier -->
  <g transform="translate(130, 40)">
    <!-- Base Dossier Card -->
    <rect x="0" y="0" width="140" height="155" rx="14" fill="url(#c1card)" />
    <!-- Dossier Header Bar -->
    <rect x="16" y="20" width="60" height="8" rx="4" fill="#DE8C5A" />
    <circle cx="112" cy="24" r="8" fill="#92C7CF" />
    <!-- Job details lines -->
    <rect x="16" y="44" width="108" height="6" rx="3" fill="#203D43" fill-opacity="0.7" />
    <rect x="16" y="58" width="88" height="5" rx="2.5" fill="#203D43" fill-opacity="0.4" />
    <rect x="16" y="70" width="96" height="5" rx="2.5" fill="#203D43" fill-opacity="0.4" />

    <!-- Synchronized CV Pill -->
    <g transform="translate(16, 92)">
      <rect width="108" height="28" rx="6" fill="#92C7CF" fill-opacity="0.35" stroke="#92C7CF" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4.5" fill="#3D7C88" />
      <path d="M12.5 14 L14 15.5 L17 12.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
      <rect x="26" y="11" width="56" height="6" rx="3" fill="#203D43" />
    </g>

    <!-- Start Arrow Pill -->
    <g transform="translate(42, 132)">
      <rect width="56" height="18" rx="9" fill="#DE8C5A" />
      <path d="M24 9 L34 9 M31 6 L34 9 L31 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Ambient audio/question cues -->
  <circle cx="70" cy="120" r="28" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <circle cx="70" cy="120" r="14" fill="#FFFFFF" fill-opacity="0.3" />
  <circle cx="330" cy="100" r="22" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35" />
</svg>
