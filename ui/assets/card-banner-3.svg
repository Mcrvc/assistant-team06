<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7E8E9" />
      <stop offset="60%" stop-color="#BADCE0" />
      <stop offset="100%" stop-color="#A2CED5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF9F1" />
    </linearGradient>
  </defs>

  <!-- Cool collaborative background -->
  <rect width="400" height="240" fill="url(#c3bg)" />

  <!-- Abstract dialogue wave layers -->
  <path d="M0 180 C 100 140, 200 200, 300 160 C 350 140, 380 150, 400 160 L 400 240 L 0 240 Z" fill="#92C7CF" fill-opacity="0.35" />

  <!-- Floating Feedback & Rating Showcase Card -->
  <g transform="translate(115, 38)">
    <rect width="170" height="164" rx="16" fill="url(#cardGrad)" stroke="#B9D5D7" stroke-width="1.2" />

    <!-- Chat speech bubble avatar -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#92C7CF" fill-opacity="0.5" />
      <path d="M12 18 C12 14.7 14.7 12 18 12 C21.3 12 24 14.7 24 18 C24 20.3 22.7 22.3 20.7 23.3 L21 26 L17.5 24 C14.4 23.6 12 21.1 12 18 Z" fill="#203D43" />
      <!-- Star ratings row -->
      <g transform="translate(42, 6)">
        <polygon points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" fill="#E5A642" />
        <polygon points="20,0 22,4 26,5 23,8 24,12 20,10 16,12 17,8 14,5 18,4" fill="#E5A642" />
        <polygon points="34,0 36,4 40,5 37,8 38,12 34,10 30,12 31,8 28,5 32,4" fill="#E5A642" />
        <polygon points="48,0 50,4 54,5 51,8 52,12 48,10 44,12 45,8 42,5 46,4" fill="#E5A642" />
        <polygon points="62,0 64,4 68,5 65,8 66,12 62,10 58,12 59,8 56,5 60,4" fill="#E5A642" />
      </g>
    </g>

    <!-- Feedback input slider bars -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="80" height="6" rx="3" fill="#203D43" fill-opacity="0.75" />
      <rect x="0" y="16" width="130" height="7" rx="3.5" fill="#E5E1DA" />
      <rect x="0" y="16" width="95" height="7" rx="3.5" fill="#3D7C88" />
      <circle cx="95" cy="19.5" r="7" fill="#FBF9F1" stroke="#3D7C88" stroke-width="2.5" />
    </g>

    <!-- User testimonial note -->
    <g transform="translate(20, 110)">
      <rect width="130" height="36" rx="8" fill="#F0F7F5" />
      <rect x="12" y="10" width="106" height="5" rx="2.5" fill="#64787B" />
      <rect x="12" y="20" width="70" height="5" rx="2.5" fill="#64787B" fill-opacity="0.6" />
    </g>
  </g>

  <!-- Ambient hearts & stars -->
  <polygon points="60,60 63,67 70,68 65,73 66,80 60,76 54,80 55,73 50,68 57,67" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="330" cy="80" r="14" fill="#FFFFFF" fill-opacity="0.4" />
  <polygon points="330,73 332,77 336,78 333,81 334,85 330,83 326,85 327,81 324,78 328,77" fill="#E5A642" />
</svg>
