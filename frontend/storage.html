<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Interviews · Yourin</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="storage">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="header-inner" aria-label="Main navigation">
    <a class="brand header-brand" href="dashboard.html">
      <span class="brand-icon"><img src="assets/logo.svg" alt="" aria-hidden="true"></span>
      <span class="brand-text">Yourin</span>
    </a>
    <div class="header-nav">
      <a class="nav-link" href="dashboard.html" data-nav="dashboard">Dashboard</a>
      <a class="nav-link is-active" href="storage.html" data-nav="storage">Your Interview</a>
      <a class="nav-link" href="system-feedback.html" data-nav="feedback">System Feedback</a>
    </div>
    <div class="header-right">
      <a class="profile-link" href="profile.html" aria-label="Profile" title="Profile" data-nav="profile">
        <img class="header-avatar" src="assets/avatar.svg" alt="">
        <span class="profile-name" data-username>Eric Arthur Blair</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <a class="header-logout-link" href="sign-in.html" data-sign-out aria-label="Sign out" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-text">Sign out</span>
      </a>
    </div>
  </nav>
</header>
<main id="main" class="page storage-page">
  <section class="panel storage-panel">
    <div class="storage-header">
      <h2>Your Interviews</h2>
    </div>

    <!-- 4-Column Grid Header -->
    <div class="storage-grid-head" aria-hidden="true">
      <div class="col-head col-name">Name</div>
      <div class="col-head col-date">Date</div>
      <div class="col-head col-status">Status</div>
      <div class="col-head col-actions">Actions</div>
    </div>

    <!-- Interview Cards List -->
    <div class="storage-list" id="interview-list">
      <!-- Populated dynamically by app.js -->
    </div>

    <!-- Empty State -->
    <div class="storage-empty is-hidden" id="storage-empty">
      <div class="empty-icon">📁</div>
      <h3>No saved interviews</h3>
      <p>You haven't completed or started any interview sessions yet.</p>
      <a class="btn" href="job-profile.html" data-new-interview>Start an interview <span aria-hidden="true">→</span></a>
    </div>
  </section>
</main>
<footer class="site-footer"><span>Yourin · Interview AI Assistant</span></footer>
<noscript><p class="noscript">Enable JavaScript to save your demo answers and use the forms.</p></noscript>
</body>
</html>
