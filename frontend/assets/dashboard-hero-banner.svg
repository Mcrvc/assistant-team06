<svg width="560" height="460" viewBox="0 0 560 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ambientAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF9F1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#92C7CF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#92C7CF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#E5F5F4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#92C7CF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34616A" stop-opacity="0.75" />
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF9F1" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#92C7CF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#203D43" stop-opacity="0.1" />
    </radialGradient>
    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#203D43" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Ambient Ripple Aura -->
  <circle cx="280" cy="230" r="210" fill="url(#ambientAura)" />

  <!-- Concentric Soundwave & Acoustic Rings -->
  <circle cx="280" cy="230" r="200" stroke="#FBF9F1" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="10 10" />
  <circle cx="280" cy="230" r="165" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.4" />
  <circle cx="280" cy="230" r="135" stroke="#203D43" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Radiating Audio / Dialogue Wave Bars -->
  <g stroke="#FBF9F1" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="80" y1="230" x2="110" y2="230" />
    <line x1="60" y1="230" x2="70" y2="230" stroke-width="2" />
    <line x1="450" y1="230" x2="480" y2="230" />
    <line x1="490" y1="230" x2="500" y2="230" stroke-width="2" />
  </g>

  <!-- Central Glass Orb (Hero Centerpiece - NO PLAY BUTTON) -->
  <g filter="url(#orbShadow)">
    <circle cx="280" cy="230" r="118" fill="url(#orbGlow)" />
    <!-- Glass Highlight Arch -->
    <ellipse cx="255" cy="165" rx="60" ry="32" fill="#FFFFFF" fill-opacity="0.7" transform="rotate(-15 255 165)" />
    <!-- Inner Aura -->
    <circle cx="280" cy="230" r="85" fill="url(#innerGlow)" />

    <!-- Yourin Logo Motif Inside Glass Orb (Balanced Centered) -->
    <g transform="translate(240, 202) scale(0.8)">
      <ellipse cx="55.5" cy="33.1" rx="44.5" ry="33.1" fill="#FBF9F1" />
      <path d="M28.3 16.5 L69 48.6 L12.5 67.3 Z" fill="#FBF9F1" />
      <path d="M72 41.8 C69.3 45.7 65.2 48.4 60.5 49.5 C55.9 50.6 50.9 49.9 46.6 47.7 C42.3 45.4 38.9 41.7 37.1 37.2 C35.3 32.8 35.2 27.8 36.8 23.4 C38.3 18.9 41.5 15.2 45.7 12.9 C49.9 10.6 54.8 9.9 59.5 11 C64.2 12.1 68.5 14.8 71.4 18.6 C74.3 22.5 75.8 27.2 75.5 32 L55.6 30.3 Z" fill="#203D43" />
    </g>
  </g>

  <!-- Ambient Floating Tech Nodes -->
  <circle cx="90" cy="130" r="4" fill="#FBF9F1" fill-opacity="0.75" />
  <circle cx="160" cy="80" r="3" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="480" cy="120" r="4.5" fill="#FBF9F1" fill-opacity="0.65" />
  <circle cx="420" cy="75" r="3" fill="#FFFFFF" fill-opacity="0.75" />
  <circle cx="490" cy="340" r="4" fill="#FBF9F1" fill-opacity="0.55" />
  <circle cx="80" cy="330" r="3" fill="#FFFFFF" fill-opacity="0.65" />
</svg>
