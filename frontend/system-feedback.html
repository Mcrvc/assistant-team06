<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Feedback · Yourin</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/errors.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="system-feedback">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="header-inner" aria-label="Main navigation">
    <a class="brand header-brand" href="dashboard.html">
      <span class="brand-icon"><img src="assets/logo.svg" alt="" aria-hidden="true"></span>
      <span class="brand-text">Yourin</span>
    </a>
    <div class="header-nav">
      <a class="nav-link" href="dashboard.html" data-nav="dashboard">Dashboard</a>
      <a class="nav-link" href="storage.html" data-nav="storage">Your Interview</a>
      <a class="nav-link is-active" href="system-feedback.html" data-nav="feedback">System Feedback</a>
    </div>
    <div class="header-right">
      <a class="profile-link" href="profile.html" aria-label="Profile" title="Profile" data-nav="profile">
        <img class="header-avatar" src="assets/avatar.svg" alt="">
        <span class="profile-name" data-username>Eric Arthur Blair</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <a class="header-logout-link" href="sign-in.html" data-sign-out aria-label="Sign out" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-text">Sign out</span>
      </a>
    </div>
  </nav>
</header>
<main id="main" class="page feedback-page">
  <form class="panel survey-panel" id="feedback-form">
    <div class="survey-list">
      <div class="survey-row">
        <label class="survey-label">
          <span class="survey-number">01</span>
          <span class="survey-text">How accurate was the AI-generated interview feedback? (1 = very poor, 5 = excellent)</span>
        </label>
        <div class="survey-field-input">
          <div class="rating-group" role="radiogroup" aria-label="Grade rating">
            <label class="rating-option"><input type="radio" name="grade_rating" value="1" required><span>1</span></label>
            <label class="rating-option"><input type="radio" name="grade_rating" value="2"><span>2</span></label>
            <label class="rating-option"><input type="radio" name="grade_rating" value="3"><span>3</span></label>
            <label class="rating-option"><input type="radio" name="grade_rating" value="4"><span>4</span></label>
            <label class="rating-option"><input type="radio" name="grade_rating" value="5"><span>5</span></label>
          </div>
        </div>
      </div>

      <div class="survey-row">
        <label class="survey-label">
          <span class="survey-number">02</span>
          <span class="survey-text">Were the interview questions appropriate for your targeted job profile and experience level?</span>
        </label>
        <div class="survey-field-input">
          <div class="rating-group" role="radiogroup" aria-label="Quality rating">
            <label class="rating-option"><input type="radio" name="quality_rating" value="1" required><span>1</span></label>
            <label class="rating-option"><input type="radio" name="quality_rating" value="2"><span>2</span></label>
            <label class="rating-option"><input type="radio" name="quality_rating" value="3"><span>3</span></label>
            <label class="rating-option"><input type="radio" name="quality_rating" value="4"><span>4</span></label>
            <label class="rating-option"><input type="radio" name="quality_rating" value="5"><span>5</span></label>
          </div>
        </div>
      </div>

      <div class="survey-row">
        <label class="survey-label">
          <span class="survey-number">03</span>
          <span class="survey-text">How difficult were the interview questions?</span>
        </label>
        <div class="survey-field-input">
          <div class="difficulty-group" role="radiogroup" aria-label="Difficulty">
            <label class="difficulty-option"><input type="radio" name="difficulty" value="too_easy"><span>Too easy</span></label>
            <label class="difficulty-option"><input type="radio" name="difficulty" value="just_right"><span>Just right</span></label>
            <label class="difficulty-option"><input type="radio" name="difficulty" value="too_hard"><span>Too hard</span></label>
          </div>
        </div>
      </div>

      <div class="survey-row">
        <label class="survey-label">
          <span class="survey-number">04</span>
          <span class="survey-text">Would you recommend Yourin to others?</span>
        </label>
        <div class="survey-field-input">
          <div class="recommend-group" role="radiogroup" aria-label="Would recommend">
            <label class="recommend-option"><input type="radio" name="would_recommend" value="true"><span>Yes</span></label>
            <label class="recommend-option"><input type="radio" name="would_recommend" value="false"><span>No</span></label>
          </div>
        </div>
      </div>

      <div class="survey-row">
        <label class="survey-label" for="feedback-comments">
          <span class="survey-number">05</span>
          <span class="survey-text">Additional comments, bugs, or suggestions (optional).</span>
        </label>
        <div class="survey-field-input">
          <textarea id="feedback-comments" rows="3" maxlength="2000" placeholder="Type your answer..."></textarea>
        </div>
      </div>
    </div>

    <div class="survey-actions">
      <button class="btn btn-submit-feedback" type="submit">Submit feedback <span aria-hidden="true">→</span></button>
    </div>
  </form>
</main>
<footer class="site-footer"><span>Yourin · Interview AI Assistant</span></footer>
<noscript><p class="noscript">Enable JavaScript to save your demo answers and use the forms.</p></noscript>
</body>
</html>
