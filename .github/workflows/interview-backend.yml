name: Interview backend scope

on:
  pull_request:
  push:
    branches: ["feat/**", "backend/interview"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yourin_test
          POSTGRES_DB: yourin_interview_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55436:5432"
        options: >-
          --health-cmd "pg_isready -U yourin_test -d yourin_interview_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTERVIEW_TEST_POSTGRES_URL: postgresql+psycopg://yourin_test@127.0.0.1:55436/yourin_interview_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[web,dev,postgres-test]"
      - run: python -m pip check
      - run: python -m pytest -q
